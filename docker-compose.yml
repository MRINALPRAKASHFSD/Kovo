# ─────────────────────────────────────────────────────────────
# KOVO — Docker Compose (Local Development)
# ─────────────────────────────────────────────────────────────
# Production deployments use separate Compose files per service
# located in infrastructure/docker/
# ─────────────────────────────────────────────────────────────

name: kovo

services:
  # ── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: kovo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kovo_db}
      POSTGRES_USER: ${DB_USER:-kovo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kovo_user} -d ${DB_NAME:-kovo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kovo-network

  # ── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: kovo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kovo-network

  # ── MinIO (S3-Compatible Storage) ─────────────────────────
  minio:
    image: minio/minio:latest
    container_name: kovo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - kovo-network

  # ── Backend (FastAPI) ─────────────────────────────────────
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: kovo-backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
      - /app/.venv
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kovo-network

  # ── Web (Next.js) ─────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      target: development
    container_name: kovo-web
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - kovo-network

  # ── Admin (Next.js) ───────────────────────────────────────
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      target: development
    container_name: kovo-admin
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - kovo-network

  # ── Nginx (Reverse Proxy) ─────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: kovo-nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - web
      - admin
    networks:
      - kovo-network

  # ── Prometheus ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: kovo-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - kovo-network

  # ── Grafana ───────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.1
    container_name: kovo-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3002:3000"
    depends_on:
      - prometheus
    networks:
      - kovo-network

# ── Volumes ───────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────
networks:
  kovo-network:
    driver: bridge
    name: kovo-network
