[project]
name = "kovo-backend"
version = "0.1.0-alpha"
description = "KOVO Backend — FastAPI Clean Architecture"
requires-python = ">=3.13"
license = { text = "Proprietary" }

dependencies = [
  # Web framework
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.30.0",

  # Database
  "sqlalchemy[asyncio]>=2.0.30",
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "psycopg2-binary>=2.9.9",

  # Cache
  "redis[hiredis]>=5.0.0",
  "aioredis>=2.0.1",

  # Validation
  "pydantic[email]>=2.6.0",
  "pydantic-settings>=2.2.0",

  # Authentication
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",

  # Storage
  "aioboto3>=12.4.0",

  # Task Queue
  "celery[redis]>=5.3.6",
  "flower>=2.0.0",

  # Email
  "fastapi-mail>=1.4.1",
  "jinja2>=3.1.3",

  # Observability
  "prometheus-client>=0.20.0",
  "opentelemetry-api>=1.24.0",
  "opentelemetry-sdk>=1.24.0",
  "structlog>=24.1.0",

  # Utilities
  "python-dotenv>=1.0.1",
  "tenacity>=8.2.3",
  "orjson>=3.9.15",
]

[dependency-groups]
dev = [
  "pytest>=8.1.0",
  "pytest-asyncio>=0.23.6",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "httpx>=0.27.0",
  "factory-boy>=3.3.0",
  "faker>=24.3.0",
  "ruff>=0.4.0",
  "mypy>=1.9.0",
  "types-redis>=4.6.0",
  "types-passlib>=1.7.7",
  "pre-commit>=3.7.0",
  "asgi-lifespan>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "C4", "DTZ", "T20", "RET", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=. --cov-report=term-missing --cov-report=xml -v"

[tool.coverage.run]
omit = ["tests/*", "alembic/*", "*/migrations/*"]
